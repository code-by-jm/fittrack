<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Progress</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header>
    <h1>FitTrack</h1>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <a href="workout.html">Workouts</a>
        <a href="food.html">Food Tracker</a>
        <a href="progress.html">Progress</a>
    </nav>
</header>

<main class="container">

    <h2>My Fitness Progress</h2>

    <form id="progressForm">

        <label>Current Weight (kg)</label>
        <input type="number" id="weight"
               min="30" max="300" step="0.1" required>

        <button type="submit">Save Weight</button>

        <p id="progressMessage"></p>

    </form>

    <h2 style="margin-top:30px">Weight History</h2>

    <div id="progressList" class="items-grid"></div>

</main>
<script src="assets/js/auth.js"></script>
<script src="assets/js/progress.js"></script>
<button onclick="logout()">Logout</button>
</body>
</html>
