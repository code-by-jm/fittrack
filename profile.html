<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - My Profile</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header>
    <h1>FitTrack</h1>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="profile.html">My Profile</a>
        <a href="workout.html">Workouts</a>
        <a href="food.html">Food Tracker</a>
        <a href="progress.html">Progress</a>
    </nav>
</header>

<main class="container">

    <h2>My Fitness Profile</h2>
    <p>Enter your information to calculate your fitness targets.</p>

    <form id="profileForm">

        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Age</label>
        <input type="number" id="age" min="18" max="100" required>

        <label>Sex</label>
        <select id="sex" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label>Height (cm)</label>
        <input type="number" id="height" min="100" max="250" required>

        <label>Weight (kg)</label>
        <input type="number" id="weight" min="30" max="300" step="0.1" required>

        <label>Activity Level</label>
        <select id="activity_level">
            <option value="sedentary">Sedentary</option>
            <option value="light">Lightly Active</option>
            <option value="moderate">Moderately Active</option>
            <option value="very_active">Very Active</option>
        </select>

        <label>Fitness Goal</label>
        <select id="fitness_goal">
            <option value="muscle_gain">Muscle Gain</option>
            <option value="weight_loss">Weight Loss</option>
            <option value="maintenance">Maintenance</option>
        </select>

        <label>Workout Days Per Week</label>
        <select id="workout_days">
            <option value="2">2 Days</option>
            <option value="3" selected>3 Days</option>
            <option value="4">4 Days</option>
            <option value="5">5 Days</option>
            <option value="6">6 Days</option>
            <option value="7">7 Days</option>
        </select>

        <button type="submit">Save My Profile</button>

        <p id="profileMessage"></p>

    </form>

    <section id="targets" class="item-card" hidden>
        <h2>Your Fitness Targets</h2>
        <p id="bmr"></p>
        <p id="tdee"></p>
        <p id="calories"></p>
        <p id="protein"></p>
    </section>

</main>
<script src="assets/js/auth.js"></script>
<script src="assets/js/profile.js"></script>
<button onclick="logout()">Logout</button>

</body>
</html>
