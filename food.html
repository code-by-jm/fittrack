<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Food Tracker</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header>
    <h1>FitTrack</h1>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <a href="workout.html">Workouts</a>
        <a href="food.html">Food Tracker</a>
        <a href="progress.html">Progress</a>
    </nav>
</header>

<main class="container">

    <h2>Food & Nutrition Tracker</h2>

    <form id="foodForm">

        <label>Select Food</label>
        <select id="food_id" required>
            <option value="">Loading foods...</option>
        </select>

        <label>Number of Servings</label>
        <input type="number" id="quantity"
               min="0.1" max="100" step="0.1"
               value="1" required>

        <button type="submit">Add Food</button>

        <p id="foodMessage"></p>

    </form>

    <section class="item-card" style="margin-top:20px">
        <h3>Today's Nutrition</h3>
        <p id="totalCalories">Calories: 0 kcal</p>
        <p id="totalProtein">Protein: 0 g</p>
    </section>

    <h2 style="margin-top:30px">Today's Food Log</h2>

    <div id="foodLogs" class="items-grid"></div>

</main>
<script src="assets/js/auth.js"></script>
<script src="assets/js/food.js"></script>
<button onclick="logout()">Logout</button>
</body>
</html>
